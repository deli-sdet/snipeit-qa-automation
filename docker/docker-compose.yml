# Controlled test environment: a private Snipe-IT + MariaDB.
# Use when the public demo blocks API tokens, deletes or DB access.
#   cp docker/.env.docker.example docker/.env.docker   (generate APP_KEY, see below)
#   docker compose -f docker/docker-compose.yml --env-file docker/.env.docker up -d
#   open http://localhost:8000 and complete the setup wizard (admin user), then create an API key
# Generate APP_KEY:  docker run --rm snipe/snipe-it:latest php artisan key:generate --show
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-snipeit}
      MARIADB_USER: ${DB_USERNAME:-snipeit}
      MARIADB_PASSWORD: ${DB_PASSWORD:-snipeit}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - '3306:3306' # exposed so SQL verification queries (sql/) can run from the test host
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      retries: 10

  app:
    image: snipe/snipe-it:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:80'
    environment:
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: ${DB_DATABASE:-snipeit}
      DB_USERNAME: ${DB_USERNAME:-snipeit}
      DB_PASSWORD: ${DB_PASSWORD:-snipeit}
    volumes:
      - app-data:/var/lib/snipeit

volumes:
  db-data:
  app-data:
